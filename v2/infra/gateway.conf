limit_req_zone $binary_remote_addr zone=global:10m rate=15r/s;
map $request_method $signin_key { default ""; POST $binary_remote_addr; }
limit_req_zone $signin_key zone=signin:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=reports:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
log_format security escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"latency_s":$request_time,"upstream_status":"$upstream_status","rate_limit":"$limit_req_status","request_id":"$request_id"}';
server_tokens off;
access_log /var/log/nginx/access.log security;
limit_req_status 429;
limit_conn_status 429;
client_max_body_size 16k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    return 308 https://127.0.0.1:8443$request_uri;
}
server {
    listen 443 ssl default_server;
    keepalive_timeout 10s;
    server_name localhost 127.0.0.1;
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 444; }
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-store always;
    add_header X-Request-ID $request_id always;
    limit_conn connections 12;
    location = /login {
        limit_req zone=signin burst=8 nodelay;
        include /etc/nginx/proxy_params_portal;
    }
    location = /reports/export {
        limit_req zone=reports burst=4 nodelay;
        include /etc/nginx/proxy_params_portal;
    }
    location / {
        limit_req zone=global burst=30 nodelay;
        include /etc/nginx/proxy_params_portal;
    }
}
