name: legacydesk-v2
services:
  app:
    build: .
    env_file: .env
    environment:
      PORTAL_ORIGINS: https://127.0.0.1:8443,https://localhost:8443
    volumes:
      - portal-data:/srv/legacydesk/state
    networks: [origin]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 96
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  waf:
    image: ghcr.io/coreruleset/modsecurity-crs:nginx@sha256:133267aa811e1a57a23b52ef04b3c30e802bcbe5454588f6d6af1f69f4b2b667
    environment:
      BACKEND: http://app:8000
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: Native
      MODSEC_AUDIT_LOG_PARTS: AHZ
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      NGINX_X_FORWARDED_PROTO: https
      NGINX_X_FORWARDED_PORT: "8443"
      PROXY_HOST_HEADER: $$http_host
      NGINX_WORKER_PROCESSES: "1"
    depends_on:
      app:
        condition: service_healthy
    networks: [origin, filtering]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
  gateway:
    image: nginx:stable-alpine
    ports:
      - 127.0.0.1:8082:80
      - 127.0.0.1:8443:443
    volumes:
      - ./infra/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/proxy_params_portal:/etc/nginx/proxy_params_portal:ro
      - ./state/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./state/tls/server.key:/etc/nginx/tls/server.key:ro
    depends_on:
      waf:
        condition: service_healthy
    networks: [filtering, edge]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
networks:
  origin:
    internal: true
  filtering:
    internal: true
  edge:
    driver: bridge
volumes:
  portal-data:
